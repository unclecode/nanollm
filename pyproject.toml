[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanollm"
version = "0.1.0"
description = "Minimal, zero-bloat LLM API wrapper. Drop-in replacement for litellm."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Unclecode", email = "unclecode@kidocode.com"},
]
dependencies = [
    "httpx[http2]>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
gcp = ["google-auth>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/unclecode/nanollm"
Repository = "https://github.com/unclecode/nanollm"

[tool.setuptools.packages.find]
include = ["nanollm*", "litellm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require API keys and network access",
]
